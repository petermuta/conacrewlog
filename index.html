<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Conacrew" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon-w.png" />
  <title>Conacrew Logistics</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css?v=147" />
  <script>
    // Runs before the page is drawn, so a signed-in phone never sees the sign-in form flash.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("conacrew.user.v2") || "null");
        if (!s || !s.role || !s.at) return;
        var maxAge = (s.role === "admin" ? 30 * 24 : 24) * 3600e3;
        if (Date.now() - s.at > maxAge) return;
        var last = Number(sessionStorage.getItem("conacrew.bounce") || 0);
        if (Date.now() - last < 8000) return; // the app just sent us back: show the form
        sessionStorage.setItem("conacrew.bounce", String(Date.now()));
        document.documentElement.classList.add("going");
        var home = { admin: "home", driver: "drive", cane_manager: "cane", passion_manager: "passion" }[s.role] || "home";
        location.replace("./app.html#" + home);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="login-page">
    <div class="login-brand">
      <img class="logo-full" src="./logo.png" alt="Conacrew Logistics" />
      <h1>Conacrew</h1>
    </div>
    <div class="login-panel">
      <form class="card" id="login" style="padding:22px;width:min(420px,100%)">
        <div class="who-tag team"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>Members</div>
        <h2 id="loginTitle">Member login</h2>
        <input class="field" name="name" placeholder="Your name" style="display:none" />
        <input class="field" name="phone" placeholder="Phone" style="margin-top:10px" />
        <input class="field" name="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" style="margin-top:10px" />
        <p class="err" id="err" style="margin:10px 0 0"></p>
        <button class="btn btn-primary wide" style="margin-top:14px" id="loginBtn">Enter Conacrew</button>
      </form>
      <div class="or-line" aria-hidden="true"><span>or</span></div>
      <a class="client-entry" href="./book.html">
        <img src="./truck-8x4-sm.jpg" alt="" />
        <span class="ce-text"><em>Client</em><b>Hire a dump truck</b><small>No login required</small></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
    </div>
  </div>
  <script src="./store.js?v=147"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
  <script>
    const HOME = { admin: "app.html#home", driver: "app.html#drive", cane_manager: "app.html#cane", passion_manager: "app.html#passion" };
    // already signed in on this phone: go straight in, without showing the form
    try {
      if (Conacrew.session() && localStorage.getItem("conacrew.db.v2")) { const u = Conacrew.user(); if (u) { location.replace(HOME[u.role]); document.documentElement.classList.add("going"); } }
    } catch (e) {}
    Conacrew.init().then(() => {
      const hasOwner = (Conacrew.db().users || []).some((u) => u.role === "admin") || Conacrew.server === "ok" || Conacrew.server === "signin";
      if (!hasOwner && Conacrew.server === "offline") {
        // New phone with no connection: wait for the office book.
        document.getElementById("loginBtn").textContent = "Try again";
        document.getElementById("err").textContent = "No connection. Connect to the internet, then tap Try again.";
        window.__waitServer = true;
      } else if (!hasOwner) {
        // brand-new site with no office book yet: first person creates the main admin
        document.getElementById("loginTitle").textContent = "Create admin";
        document.querySelector("[name=name]").style.display = "";
        document.getElementById("loginBtn").textContent = "Create and enter";
      }
      if (Conacrew.user() && !document.documentElement.classList.contains("going")) location.replace(HOME[Conacrew.user().role]);
    });
    document.getElementById("login").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = "Signing in…";
      document.getElementById("err").textContent = "";
      const fd = new FormData(e.target);
      await Conacrew.init();
      if (window.__waitServer) { location.reload(); return; }
      try {
        const users = Conacrew.db().users || [];
        if (!users.some((u) => u.role === "admin") && Conacrew.server !== "ok" && Conacrew.server !== "signin") {
          Conacrew.createOwner(fd.get("name"), fd.get("phone"), fd.get("pin"));
        }
        const json = await Conacrew.login(fd.get("phone"), fd.get("pin"));
        if (json.needsApproval) {
          document.getElementById("login").innerHTML = `<h2>Waiting for approval</h2>
            <p style="margin-top:8px">Hi ${json.name}. Ask the admin to approve this phone, then sign in again.</p>
            <button class="btn btn-primary wide" style="margin-top:14px" type="button" onclick="location.reload()">Sign in again</button>`;
          return;
        }
        sessionStorage.setItem("land", "1");
        location.replace(json.home); // keep "Signing in…" showing until the app opens
      } catch (err) {
        btn.disabled = false; btn.textContent = label;
        document.getElementById("err").textContent = err.message;
      }
    });
  </script>
</body>
</html>
