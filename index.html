<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Conacrew" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./logo-mark.png" />
  <title>Conacrew Logistics</title>
  <link rel="icon" href="./logo-mark.png" />
  <link rel="stylesheet" href="./styles.css?v=126" />
</head>
<body>
  <div class="login-page">
    <div class="login-brand">
      <img class="logo-full" src="./logo.png" alt="Conacrew Logistics" />
      <h1>Conacrew</h1>
    </div>
    <div class="login-panel">
      <form class="card" id="login" style="padding:22px;width:min(420px,100%)">
        <h2 id="loginTitle">Create admin</h2>
        <input class="field" name="name" placeholder="Your name" />
        <input class="field" name="phone" placeholder="Phone" style="margin-top:10px" />
        <input class="field" name="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" style="margin-top:10px" />
        <p class="err" id="err" style="margin:10px 0 0"></p>
        <button class="btn btn-primary wide" style="margin-top:14px" id="loginBtn">Create and enter</button>
      </form>
    </div>
  </div>
  <script src="./store.js?v=126"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
  <script>
    Conacrew.init().then(() => {
      const hasOwner = (Conacrew.db().users || []).some((u) => u.role === "admin") || Conacrew.server === "ok" || Conacrew.server === "signin";
      if (hasOwner) {
        document.getElementById("loginTitle").textContent = "Sign in";
        document.querySelector("[name=name]").style.display = "none";
        document.getElementById("loginBtn").textContent = "Enter Conacrew";
      } else if (Conacrew.server === "offline") {
        // New phone with no connection: don't start an empty book, wait for the office book.
        document.getElementById("loginTitle").textContent = "Sign in";
        document.querySelector("[name=name]").style.display = "none";
        document.getElementById("loginBtn").textContent = "Try again";
        document.getElementById("err").textContent = "Can't reach the Conacrew server. Connect to the internet, then tap Try again. First sign-in on a new phone needs a connection.";
        window.__waitServer = true;
      }
      if (Conacrew.user()) location.href = ({
        admin: "app.html#home",
        driver: "app.html#drive",
        cane_manager: "app.html#cane",
        passion_manager: "app.html#passion"
      })[Conacrew.user().role];
    });
    document.getElementById("login").addEventListener("submit", async e => {
      e.preventDefault();
      await Conacrew.init();
      const fd = new FormData(e.target);
      if (window.__waitServer) { location.reload(); return; }
      try {
        const users = Conacrew.db().users || [];
        if (!users.some((u) => u.role === "admin") && Conacrew.server !== "ok" && Conacrew.server !== "signin") {
          Conacrew.createOwner(fd.get("name"), fd.get("phone"), fd.get("pin"));
        }
        document.getElementById("loginBtn").disabled = true;
        const json = await Conacrew.login(fd.get("phone"), fd.get("pin")).finally(() => { document.getElementById("loginBtn").disabled = false; });
        if (json.needsApproval) {
          document.getElementById("login").innerHTML = `<h2>Waiting for approval</h2>
            <p style="margin-top:8px">Hi ${json.name}. This is a new phone for your login, so the admin needs to approve it first.</p>
            <p class="muted" style="margin-top:8px">Ask the admin to open <b>Team &amp; logins</b> and tap <b>Approve</b> next to your name. Then sign in again here.</p>
            <button class="btn btn-primary wide" style="margin-top:14px" type="button" onclick="location.reload()">Sign in again</button>`;
          return;
        }
        sessionStorage.setItem("land", "1");
        location.href = json.home;
      } catch (err) {
        document.getElementById("err").textContent = err.message;
      }
    });
  </script>
</body>
</html>
