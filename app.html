<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Conacrew" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./logo-mark.png" />
  <title>Conacrew Logistics</title>
  <link rel="icon" href="./logo-mark.png" />
  <link rel="stylesheet" href="./styles.css?v=132" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="top-bar">
        <button class="btn btn-ghost" id="refresh" aria-label="Refresh" onclick="softRefresh()">↻<span class="sync-dot grey" id="syncDot"></span><span class="sync-word" id="syncWord"></span></button>
        <div class="logo">
          <img class="mark-img" src="./logo-mark.png" alt="Conacrew" />
          <div class="logo-lockup">
            <strong>Conacrew</strong>
            <div class="eyebrow">Logistics</div>
          </div>
        </div>
        <div class="top-user">
          <button class="btn btn-ghost" id="out" onclick="try{Conacrew.logout()}catch(e){} location.href='./index.html'">Sign out</button>
          <div class="who-block">
            <div id="who" style="font-size:14px;font-weight:600"></div>
            <div class="eyebrow" id="role"></div>
          </div>
        </div>
      </div>
      <nav class="nav desk-only" id="nav"></nav>
    </div>
  </header>
  <div class="sync-bar" id="syncBar" hidden></div>
  <main class="wrap" id="app">
    <h1 id="bootTitle">Home</h1>
    <div class="page-links" id="bootLinks">
      <a href="#trucks">Fleet</a>
      <a href="#cane">Cane</a>
      <a href="#passion">Passion</a>
      <a href="#money">Money</a>
    </div>
  </main>
  <script>
    try {
      const s = JSON.parse(localStorage.getItem("conacrew.user.v2") || sessionStorage.getItem("conacrew.user.v2") || "null");
      const box = document.getElementById("bootLinks");
      const title = document.getElementById("bootTitle");
      if (sessionStorage.getItem("conacrew.viewAs")) {
      } else if (s && s.role === "driver" && box) {
        title.textContent = "Driver";
        box.innerHTML = '<a href="#drive">Desk</a><a href="#drive-jobs">Jobs</a><a href="#drive-pay">My pay</a><a href="#drive-report">Inspect</a>';
        if (!location.hash || location.hash === "#home") location.hash = "drive";
      } else if (s && s.role === "cane_manager" && box) {
        title.textContent = "Cane";
        box.innerHTML = '<a href="#cane">Board</a><a href="#cane-new">New buy</a><a href="#cane-sell">Sell</a>';
      } else if (s && s.role === "passion_manager" && box) {
        title.textContent = "Passion";
        box.innerHTML = '<a href="#passion">Blocks</a><a href="#field">Work</a><a href="#passion-sell">Sell</a><a href="#passion-spend">Spend</a>';
      }
    } catch (e) {}
  </script>
  <script>
    try {
      const s = JSON.parse(localStorage.getItem("conacrew.user.v2") || sessionStorage.getItem("conacrew.user.v2") || "null");
      const home = { admin: "home", driver: "drive", cane_manager: "cane", passion_manager: "passion" }[s && s.role];
      const hash = location.hash.replace("#", "");
      const ok = home && (s.role === "admin" || hash === home || hash.startsWith(home + "-") || (home === "passion" && hash.startsWith("field")));
      if (s && home && !ok && !sessionStorage.getItem("conacrew.viewAs")) location.replace("./app.html#" + home);
    } catch (e) {}
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
  <script>
    async function softRefresh() {
      try { await Conacrew.syncNow(); } catch (e) {}
      const bust = Date.now();
      const css = document.querySelector("link[href*='styles.css']");
      if (css) css.href = "./styles.css?r=" + bust;
      await new Promise((done) => {
        const s = document.createElement("script");
        s.src = "./app.js?r=" + bust;
        s.onload = done;
        s.onerror = done;
        document.body.appendChild(s);
      });
      if (window.route) route();
    }
  </script>
  <script src="./store.js?v=132"></script>
  <script src="./app.js?v=132"></script>
</body>
</html>
