<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d4a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Conacrew" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./logo-mark.png" />
  <title>Conacrew Logistics</title>
  <link rel="icon" href="./logo-mark.png" />
  <link rel="stylesheet" href="./styles.css?v=61" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="top-bar">
        <div class="logo">
          <img class="mark-img" src="./logo-mark.png" alt="Conacrew" />
          <div class="logo-lockup">
            <strong>Conacrew</strong>
            <div class="eyebrow">Logistics</div>
          </div>
        </div>
        <div class="top-user">
          <div style="text-align:right">
            <div id="who" style="font-size:14px;font-weight:600"></div>
            <div class="eyebrow" id="role"></div>
          </div>
          <button class="btn btn-ghost" id="out">Sign out</button>
        </div>
      </div>
      <label class="menu-box top-menu"><span>More pages</span><select class="field nav-jump" id="navJump" aria-label="Pages"></select></label>
      <nav class="nav desk-only" id="nav"></nav>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
  <script src="./store.js?v=61"></script>
  <script src="./app.js?v=61"></script>
</body>
</html>
